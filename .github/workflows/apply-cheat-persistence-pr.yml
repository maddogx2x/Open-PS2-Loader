name: Publish upstream cheat persistence branch

on:
  push:
    branches:
      - agent/cheat-selection-persistence

permissions:
  contents: write

concurrency:
  group: cheat-selection-persistence-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork branch
        uses: actions/checkout@v4
        with:
          ref: agent/cheat-selection-persistence
          fetch-depth: 0

      - name: Check out verified project source
        uses: actions/checkout@v4
        with:
          repository: maddogx2x/OPL-Cheat-Persistence
          ref: 50eaef7e01af23c74b647da4ec5d791a3ef70a4e
          path: project-source

      - name: Copy generic implementation only
        shell: bash
        run: |
          set -euo pipefail
          source_root="project-source/Open-PS2-Loader-3e3f34e-cheat-persistence"
          cp "$source_root/Makefile" Makefile
          cp "$source_root/include/config.h" include/config.h
          cp "$source_root/include/gui.h" include/gui.h
          cp "$source_root/include/supportbase.h" include/supportbase.h
          cp "$source_root/include/cheatconfig.h" include/cheatconfig.h
          cp "$source_root/src/cheatconfig.c" src/cheatconfig.c
          cp "$source_root/src/cheatman.c" src/cheatman.c
          cp "$source_root/src/gui.c" src/gui.c
          cp "$source_root/src/supportbase.c" src/supportbase.c
          cp "$source_root/src/hddsupport.c" src/hddsupport.c
          cp "$source_root/src/bdmsupport.c" src/bdmsupport.c
          cp "$source_root/src/ethsupport.c" src/ethsupport.c
          rm -rf project-source

      - name: Remove project-specific UI and launch behavior
        shell: python
        run: |
          from pathlib import Path

          gui = Path("src/gui.c")
          text = gui.read_text()
          start = text.index("void guiManageCheats(config_set_t *configSet)")
          end = text.index("\n}", start) + 2
          replacement = r'''void guiManageCheats(config_set_t *configSet)
          {
              int offset = 0;
              int terminate = 0;
              int cheatCount = 0;
              int selectedCheat = 0;
              int visibleCheats = 10; // Maximum number of cheats visible on screen

              while (cheatCount < MAX_CODES && strlen(gCheats[cheatCount].name) > 0)
                  cheatCount++;

              sfxPlay(SFX_MESSAGE);

              while (!terminate) {
                  guiStartFrame();
                  readPads();

                  if (getKeyOn(KEY_UP) && selectedCheat > 0) {
                      selectedCheat -= 1;
                      if (selectedCheat < offset)
                          offset = selectedCheat;
                  }

                  if (getKeyOn(KEY_DOWN) && selectedCheat < cheatCount - 1) {
                      selectedCheat += 1;
                      if (selectedCheat >= offset + visibleCheats)
                          offset = selectedCheat - visibleCheats + 1;
                  }

                  if (getKeyOn(gSelectButton)) {
                      if (!cheatConfigIsMasterCode(gCheats[selectedCheat].name))
                          gCheats[selectedCheat].enabled = !gCheats[selectedCheat].enabled;
                  }

                  if (getKeyOn(KEY_START))
                      terminate = 1;

                  guiShow();

                  rmDrawRect(0, 0, screenWidth, screenHeight, gColDarker);
                  rmDrawLine(50, 75, screenWidth - 50, 75, gColWhite);
                  rmDrawLine(50, 410, screenWidth - 50, 410, gColWhite);

                  fntRenderString(gTheme->fonts[0], screenWidth >> 1, 60, ALIGN_CENTER, 0, 0, _l(_STR_CHEAT_SELECTION), gTheme->textColor);

                  int renderedCheats = 0;
                  for (int i = offset; renderedCheats < visibleCheats && i < cheatCount; i++) {
                      if (strlen(gCheats[i].name) == 0)
                          continue;

                      int enabled = gCheats[i].enabled;
                      int boxX = 50;
                      int boxY = 100 + (renderedCheats * 30);
                      int boxWidth = rmWideScale(25);
                      int boxHeight = 17;

                      if (enabled) {
                          rmDrawRect(boxX, boxY + 3, boxWidth, boxHeight, gTheme->textColor);
                          rmDrawRect(boxX + 2, boxY + 5, boxWidth - 4, boxHeight - 4, gTheme->selTextColor);
                      }

                      u32 textColour = (i == selectedCheat) ? gTheme->selTextColor : gTheme->textColor;
                      fntRenderString(gTheme->fonts[0], boxX + 35, boxY + 3, ALIGN_LEFT, 0, 0, gCheats[i].name, textColour);
                      renderedCheats++;
                  }

                  guiDrawIconAndText(gSelectButton == KEY_CIRCLE ? CIRCLE_ICON : CROSS_ICON, _STR_SELECT, gTheme->fonts[0], 70, 417, gTheme->selTextColor);
                  guiDrawIconAndText(START_ICON, _STR_RUN, gTheme->fonts[0], 500, 417, gTheme->selTextColor);
                  guiEndFrame();
              }

              cheatConfigSaveSelections(configSet);
              configWrite(configSet);
              sfxPlay(SFX_CONFIRM);
          }'''
          gui.write_text(text[:start] + replacement + text[end:])

          support = Path("src/supportbase.c")
          text = support.read_text()
          text = text.replace(
              """            if (cheatMode == 1) {\n                cheatConfigLoadSelections(configSet);\n\n                /* PSBBN auto-launch restores saved choices silently. */\n                if ((gAutoLaunchGame == NULL) && (gAutoLaunchBDMGame == NULL))\n                    guiManageCheats(configSet);\n            }\n""",
              """            if (cheatMode == 1) {\n                cheatConfigLoadSelections(configSet);\n                guiManageCheats(configSet);\n            }\n""",
          )
          support.write_text(text)

      - name: Verify excluded project-specific behavior
        shell: bash
        run: |
          set -euo pipefail
          ! git diff -- . | grep -E 'KEY_LEFT|KEY_RIGHT|KEY_SQUARE|PSBBN auto-launch|CONFIG_OPL_HDD_MODE|CONFIG_OPL_BDM_MODE'
          test -f include/cheatconfig.h
          test -f src/cheatconfig.c

      - name: Commit branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-cheat-persistence-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist per-game cheat selections"
          git push origin agent/cheat-selection-persistence
